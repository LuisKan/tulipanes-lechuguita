<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff8dc" />
  <title>Para mi Karlita 💛</title>

  <style>
    :root{
      --yellow:#ffd84d;
      --yellow2:#ffc928;
      --yellow3:#fff09b;
      --gold:#c69a2a;
      --gold-soft:#e6c971;
      --green:#5a9748;
      --green2:#3f7a35;
      --paper:#fffaf2;
      --cream:#fff8e5;
      --ink:#6a4d14;
      --ink-soft:#856523;
      --shadow: rgba(135, 96, 11, .14);
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      min-height:100%;
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      overflow-x:hidden;
      background:
        radial-gradient(circle at 15% 12%, rgba(255,233,122,.40), transparent 24%),
        radial-gradient(circle at 85% 16%, rgba(255,241,180,.46), transparent 24%),
        linear-gradient(180deg,#fffdf7 0%, #fff5cc 100%);
      color:var(--ink);
    }

    body{
      position:relative;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:22px 10px 30px;
    }

    .glow{
      position:fixed;
      width:260px;
      height:260px;
      border-radius:50%;
      filter:blur(60px);
      opacity:.25;
      pointer-events:none;
      z-index:0;
      animation:floatGlow 8s ease-in-out infinite alternate;
    }
    .g1{ background:#ffe268; top:-70px; left:-80px; }
    .g2{ background:#ffd451; right:-95px; bottom:-85px; animation-delay:1.2s; }

    @keyframes floatGlow{
      from{ transform:translate(0,0) scale(1); }
      to{ transform:translate(16px,20px) scale(1.08); }
    }

    .page{
      width:min(95vw,780px);
      text-align:center;
      position:relative;
      z-index:2;
    }

    .tag{
      padding-top:18px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:#9f7c27;
      font-size:.82rem;
      margin-bottom:10px;
      opacity:0;
      transform:translateY(12px);
      animation:fadeUp .8s ease forwards .2s;
    }

    .title{
      margin:0;
      font-family: Georgia, "Times New Roman", serif;
      font-size:clamp(2rem,8vw,4.25rem);
      line-height:1.05;
      color:#6b4f15;
      text-shadow:0 4px 18px rgba(186,145,34,.10);
      opacity:0;
      transform:translateY(12px);
      animation:fadeUp .95s ease forwards .45s;
    }

    .title .tulip-emoji{
      font-size:.72em;
      vertical-align:middle;
      margin-inline:8px;
    }

    .subtitle{
      width:min(92%,680px);
      margin:14px auto 28px;
      font-size:clamp(1rem,3.8vw,1.45rem);
      line-height:1.55;
      color:var(--ink-soft);
      opacity:0;
      transform:translateY(12px);
      animation:fadeUp .95s ease forwards .8s;
    }

    .bouquet-stage{
      width:min(100%,720px);
      height:540px;
      margin:4px auto 10px;
      position:relative;
    }

    .bouquet-wrap{
      position:absolute;
      inset:0;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      filter:drop-shadow(0 20px 26px rgba(111,82,14,.12));
    }

    .bouquet{
      position:relative;
      width:100%;
      max-width:660px;
      height:100%;
      margin:0 auto;
    }

    .paper-left, .paper-right{
      position:absolute;
      bottom:72px;
      width:220px;
      height:260px;
      background:linear-gradient(180deg,#fffef7,#f7ebc7);
      border:1px solid rgba(210,177,81,.24);
      box-shadow:0 8px 20px rgba(163,130,36,.08);
      z-index:2;
    }

    .paper-left{
      left:143px;
      transform:rotate(-18deg);
      clip-path:polygon(12% 4%, 100% 0, 66% 100%, 0 82%);
      border-radius:24px;
      opacity:0;
      animation:paperIn .8s ease forwards 4.55s;
    }
    .paper-right{
      right:143px;
      transform:rotate(18deg);
      clip-path:polygon(0 0, 88% 4%, 100% 82%, 34% 100%);
      border-radius:24px;
      opacity:0;
      animation:paperIn .8s ease forwards 4.75s;
    }

    @keyframes paperIn{
      from{ opacity:0; transform:translateY(16px) scale(.95); }
      to{ opacity:1; }
    }

    .ribbon-band{
      position:absolute;
      left:50%;
      bottom:128px;
      width:116px;
      height:34px;
      transform:translateX(-50%);
      background:linear-gradient(180deg,#f4d662,#dca81d);
      border-radius:10px;
      z-index:5;
      opacity:0;
      box-shadow:0 6px 16px rgba(161,116,9,.16);
      animation:fadeUp .7s ease forwards 5.0s;
    }

    .ribbon-knot{
      position:absolute;
      left:50%;
      bottom:139px;
      width:24px;
      height:24px;
      transform:translateX(-50%) rotate(45deg);
      background:linear-gradient(180deg,#f7df77,#dfa71c);
      border-radius:6px;
      z-index:6;
      opacity:0;
      animation:fadeUp .7s ease forwards 5.1s;
    }

    .ribbon-loop{
      position:absolute;
      bottom:140px;
      width:38px;
      height:28px;
      border:9px solid #e3b437;
      border-radius:70% 70% 70% 70%;
      z-index:5;
      opacity:0;
      animation:fadeUp .7s ease forwards 5.1s;
    }
    .ribbon-loop.left{ left:calc(50% - 39px); border-right-width:6px; transform:rotate(-24deg); }
    .ribbon-loop.right{ left:calc(50% + 1px); border-left-width:6px; transform:scaleX(-1) rotate(-24deg); }

    .ribbon-tail{
      position:absolute;
      bottom:94px;
      width:22px;
      height:66px;
      background:linear-gradient(180deg,#f5d96d,#e0b22f);
      z-index:4;
      clip-path:polygon(0 0,100% 0,100% 84%,50% 100%,0 84%);
      opacity:0;
      animation:fadeUp .7s ease forwards 5.2s;
    }
    .ribbon-tail.left{ left:calc(50% - 30px); transform:rotate(8deg); }
    .ribbon-tail.right{ left:calc(50% + 8px); transform:rotate(-8deg); }

    .tulip{
      position:absolute;
      left:50%;
      bottom:130px;
      width:90px;
      height:360px;
      transform-origin:bottom center;
      opacity:0;
      animation:bloom 1s cubic-bezier(.18,.88,.23,1.18) forwards;
      z-index:3;
    }

    /* fan bouquet positions */
    .t1{ margin-left:-248px; height:305px; animation-delay:1.25s; transform:translateY(42px) scale(.4) rotate(-32deg); z-index:3; }
    .t2{ margin-left:-190px; height:335px; animation-delay:1.65s; transform:translateY(42px) scale(.4) rotate(-22deg); z-index:4; }
    .t3{ margin-left:-132px; height:375px; animation-delay:2.05s; transform:translateY(42px) scale(.4) rotate(-14deg); z-index:5; }
    .t4{ margin-left:-64px;  height:420px; animation-delay:2.45s; transform:translateY(42px) scale(.4) rotate(-6deg); z-index:6; }
    .t5{ margin-left:0px;    height:438px; animation-delay:2.85s; transform:translateY(42px) scale(.4); z-index:7; }
    .t6{ margin-left:66px;   height:418px; animation-delay:3.25s; transform:translateY(42px) scale(.4) rotate(7deg); z-index:6; }
    .t7{ margin-left:132px;  height:380px; animation-delay:3.65s; transform:translateY(42px) scale(.4) rotate(15deg); z-index:5; }
    .t8{ margin-left:196px;  height:338px; animation-delay:4.05s; transform:translateY(42px) scale(.4) rotate(24deg); z-index:4; }
    .t9{ margin-left:254px;  height:304px; animation-delay:4.45s; transform:translateY(42px) scale(.4) rotate(34deg); z-index:3; }

    @keyframes bloom{
      0%{ opacity:0; }
      60%{ opacity:1; transform:translateY(-3px) scale(1.06) rotate(var(--rot, 0deg)); }
      100%{ opacity:1; transform:translateY(0) scale(1) rotate(var(--rot, 0deg)); }
    }

    .stem{
      position:absolute;
      left:50%;
      bottom:0;
      width:9px;
      height:calc(100% - 88px);
      transform:translateX(-50%);
      border-radius:10px;
      background:linear-gradient(90deg,var(--green2),var(--green),#7db260);
      box-shadow:inset -1px 0 0 rgba(255,255,255,.15);
    }

    .flower{
      position:absolute;
      left:50%;
      top:10px;
      width:86px;
      height:88px;
      transform:translateX(-50%);
      filter:drop-shadow(0 6px 8px rgba(210,154,22,.16));
    }

    .petal{
      position:absolute;
      width:48px;
      height:72px;
      border-radius:55% 55% 44% 44% / 74% 74% 34% 34%;
      background:linear-gradient(180deg,var(--yellow3),var(--yellow) 52%, var(--yellow2) 100%);
      box-shadow:inset 0 -8px 12px rgba(199,140,14,.10);
    }

    .petal.left{ left:4px; top:12px; transform:rotate(-21deg); }
    .petal.mid{ left:19px; top:2px; width:50px; height:76px; z-index:2; background:linear-gradient(180deg,#fff5a8,#ffe05d 56%,#ffc627 100%); }
    .petal.right{ right:4px; top:12px; transform:rotate(21deg); }

    .petal.inner-left, .petal.inner-right{
      width:28px;
      height:42px;
      top:28px;
      z-index:3;
      opacity:.65;
      background:linear-gradient(180deg,#ffef8a,#ffd84c);
    }
    .petal.inner-left{ left:23px; transform:rotate(-10deg); }
    .petal.inner-right{ right:23px; transform:rotate(10deg); }

    .leaf{
      position:absolute;
      width:42px;
      height:126px;
      background:linear-gradient(135deg,#7db161,#4b8d3f);
      border-radius:88% 0 88% 0;
      transform-origin:bottom center;
      opacity:.96;
      box-shadow:inset -2px -4px 10px rgba(255,255,255,.08);
    }
    .leaf.left{ left:14px; bottom:64px; transform:rotate(-33deg); }
    .leaf.right{ right:14px; bottom:104px; transform:scaleX(-1) rotate(-30deg); }

    .sparkle{
      position:absolute;
      color:#efc84a;
      font-size:22px;
      opacity:0;
      animation:fadeBlink 2s ease-in-out infinite;
    }
    .s1{ left:65px; top:112px; animation-delay:4.9s; }
    .s2{ right:72px; top:148px; animation-delay:5.2s; }
    .s3{ left:160px; top:86px; animation-delay:5.5s; }
    .s4{ right:160px; top:88px; animation-delay:5.8s; }

    @keyframes fadeBlink{
      0%,100%{ opacity:0; transform:scale(.8); }
      50%{ opacity:1; transform:scale(1.1); }
    }

    .message{
      width:min(92%,660px);
      margin:8px auto 0;
      padding:26px 22px;
      background:rgba(255,255,255,.72);
      border:1px solid rgba(210,172,67,.22);
      border-radius:28px;
      box-shadow:0 16px 45px rgba(166,124,23,.12);
      backdrop-filter:blur(10px);
      opacity:0;
      transform:translateY(16px) scale(.98);
      animation:messageIn .9s ease forwards 5.45s;
    }

    .message p{
      margin:0;
      font-family: Georgia, "Times New Roman", serif;
      font-size:clamp(1.45rem,5vw,2.25rem);
      line-height:1.34;
      color:#6a4d14;
    }

    .replay{
      margin-top:22px;
      border:none;
      padding:14px 28px;
      border-radius:999px;
      background:linear-gradient(180deg,#ffe681,#f4d858);
      color:#6d5315;
      font-weight:800;
      font-size:1rem;
      cursor:pointer;
      box-shadow:0 12px 26px rgba(175,129,21,.16);
      opacity:0;
      transform:translateY(12px);
      animation:fadeUp .8s ease forwards 6s;
    }

    .replay:active{ transform:scale(.98); }

    .petal-fall{
      position:fixed;
      top:-40px;
      width:16px;
      height:28px;
      border-radius:72% 0 72% 0;
      background:linear-gradient(180deg,#fff1a3,#ffd43d);
      opacity:.8;
      pointer-events:none;
      z-index:1;
      animation:fall linear forwards;
    }

    @keyframes fall{
      0%{ transform:translate3d(0,-5vh,0) rotate(0deg); opacity:0; }
      10%{ opacity:.85; }
      100%{ transform:translate3d(var(--drift),110vh,0) rotate(560deg); opacity:.05; }
    }

    @keyframes fadeUp{
      to{ opacity:1; transform:translateY(0); }
    }

    @keyframes messageIn{
      to{ opacity:1; transform:translateY(0) scale(1); }
    }

    @media (max-width:700px){
      .bouquet-stage{
        height:500px;
      }
      .paper-left{ left:70px; }
      .paper-right{ right:70px; }
      .t1{ margin-left:-180px; }
      .t2{ margin-left:-140px; }
      .t3{ margin-left:-100px; }
      .t4{ margin-left:-50px; }
      .t5{ margin-left:0px; }
      .t6{ margin-left:50px; }
      .t7{ margin-left:100px; }
      .t8{ margin-left:140px; }
      .t9{ margin-left:180px; }
    }

    @media (max-width:560px){
      body{ padding:10px 8px 26px; }
      .title{ font-size:clamp(2rem,10vw,3.6rem); }
      .subtitle{ margin-bottom:20px; }
      .bouquet-stage{ height:455px; }
      .paper-left, .paper-right{ width:150px; height:210px; bottom:78px; }
      .paper-left{ left:34px; }
      .paper-right{ right:34px; }
      .tulip{ width:74px; }
      .flower{ width:72px; height:76px; }
      .petal{ width:41px; height:64px; }
      .petal.mid{ width:43px; height:68px; left:16px; }
      .petal.inner-left{ left:20px; }
      .petal.inner-right{ right:20px; }
      .leaf{ width:34px; height:110px; }
      .t1{ margin-left:-150px; height:268px; }
      .t2{ margin-left:-117px; height:295px; }
      .t3{ margin-left:-84px; height:332px; }
      .t4{ margin-left:-42px; height:360px; }
      .t5{ margin-left:0; height:376px; }
      .t6{ margin-left:42px; height:360px; }
      .t7{ margin-left:84px; height:332px; }
      .t8{ margin-left:117px; height:295px; }
      .t9{ margin-left:150px; height:268px; }
      .ribbon-band{ bottom:126px; width:98px; }
      .ribbon-knot{ bottom:137px; }
      .message{ margin-top:2px; }
    }

    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{
        animation-duration:.01ms !important;
        animation-delay:0ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <main class="page">
    <div class="tag">UN DETALLITO PARA TI</div>
    <h1 class="title"><span class="tulip-emoji">🌷</span>Para mi Karlita<span class="tulip-emoji">🌷</span></h1>
    <div class="subtitle">Porque hasta un pequeño detalle puede alegrarte el día.</div>

    <section class="bouquet-stage" aria-label="Ramo animado de tulipanes amarillos">
      <div class="bouquet-wrap">
        <div class="bouquet">
          <div class="sparkle s1">✦</div>
          <div class="sparkle s2">✦</div>
          <div class="sparkle s3">✦</div>
          <div class="sparkle s4">✦</div>

          <div class="tulip t1" style="--rot:-32deg">
            <div class="flower">
              <span class="petal left"></span><span class="petal mid"></span><span class="petal right"></span>
              <span class="petal inner-left"></span><span class="petal inner-right"></span>
            </div>
            <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
          </div>
          <div class="tulip t2" style="--rot:-22deg">
            <div class="flower">
              <span class="petal left"></span><span class="petal mid"></span><span class="petal right"></span>
              <span class="petal inner-left"></span><span class="petal inner-right"></span>
            </div>
            <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
          </div>
          <div class="tulip t3" style="--rot:-14deg">
            <div class="flower">
              <span class="petal left"></span><span class="petal mid"></span><span class="petal right"></span>
              <span class="petal inner-left"></span><span class="petal inner-right"></span>
            </div>
            <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
          </div>
          <div class="tulip t4" style="--rot:-6deg">
            <div class="flower">
              <span class="petal left"></span><span class="petal mid"></span><span class="petal right"></span>
              <span class="petal inner-left"></span><span class="petal inner-right"></span>
            </div>
            <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
          </div>
          <div class="tulip t5" style="--rot:0deg">
            <div class="flower">
              <span class="petal left"></span><span class="petal mid"></span><span class="petal right"></span>
              <span class="petal inner-left"></span><span class="petal inner-right"></span>
            </div>
            <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
          </div>
          <div class="tulip t6" style="--rot:7deg">
            <div class="flower">
              <span class="petal left"></span><span class="petal mid"></span><span class="petal right"></span>
              <span class="petal inner-left"></span><span class="petal inner-right"></span>
            </div>
            <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
          </div>
          <div class="tulip t7" style="--rot:15deg">
            <div class="flower">
              <span class="petal left"></span><span class="petal mid"></span><span class="petal right"></span>
              <span class="petal inner-left"></span><span class="petal inner-right"></span>
            </div>
            <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
          </div>
          <div class="tulip t8" style="--rot:24deg">
            <div class="flower">
              <span class="petal left"></span><span class="petal mid"></span><span class="petal right"></span>
              <span class="petal inner-left"></span><span class="petal inner-right"></span>
            </div>
            <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
          </div>
          <div class="tulip t9" style="--rot:34deg">
            <div class="flower">
              <span class="petal left"></span><span class="petal mid"></span><span class="petal right"></span>
              <span class="petal inner-left"></span><span class="petal inner-right"></span>
            </div>
            <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
          </div>

          <div class="paper-left"></div>
          <div class="paper-right"></div>

          <div class="ribbon-band"></div>
          <div class="ribbon-knot"></div>
          <div class="ribbon-loop left"></div>
          <div class="ribbon-loop right"></div>
          <div class="ribbon-tail left"></div>
          <div class="ribbon-tail right"></div>
        </div>
      </div>
    </section>

    <section class="message">
      <p>Para ti mi Lechuguita,<br>que tengas un hermoso día 💛</p>
    </section>

    <button class="replay" onclick="replayAnimation()">Ver otra vez ✨</button>
  </main>

  <script>
    function createFallingPetal(){
      const petal = document.createElement("span");
      petal.className = "petal-fall";
      petal.style.left = Math.random() * 100 + "vw";
      petal.style.setProperty("--drift", (Math.random() * 180 - 90) + "px");
      petal.style.animationDuration = (5 + Math.random() * 5) + "s";
      petal.style.animationDelay = (Math.random() * 1.5) + "s";
      petal.style.transform = `scale(${0.65 + Math.random() * 0.75})`;
      document.body.appendChild(petal);
      setTimeout(() => petal.remove(), 11000);
    }

    let petalsStarted = false;
    let petalInterval;

    function startPetals(){
      if(petalsStarted) return;
      petalsStarted = true;
      petalInterval = setInterval(createFallingPetal, 700);
    }

    setTimeout(startPetals, 4200);

    function replayAnimation(){
      const animated = document.querySelectorAll(
        '.tag, .title, .subtitle, .tulip, .paper-left, .paper-right, .ribbon-band, .ribbon-knot, .ribbon-loop, .ribbon-tail, .message, .replay, .sparkle'
      );

      animated.forEach(el => {
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = '';
      });

      window.scrollTo({ top:0, behavior:'smooth' });
    }
  </script>
</body>
</html>
