<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff8dc" />
  <title>Para mi lechuguita 💛</title>

  <style>
    :root{
      --yellow:#ffd84d;
      --yellow-2:#ffbf1f;
      --yellow-3:#ffe985;
      --green:#4f8a3b;
      --green-dark:#2f642b;
      --cream:#fffaf0;
      --gold:#c79222;
      --ink:#594718;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      overflow-x:hidden;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,225,113,.34), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(255,239,170,.45), transparent 26%),
        linear-gradient(180deg,#fffdf6 0%,#fff7da 100%);
      color:var(--ink);
      position:relative;
    }

    .glow{
      position:fixed;
      width:280px;
      height:280px;
      border-radius:50%;
      filter:blur(55px);
      opacity:.28;
      pointer-events:none;
      animation:floatGlow 7s ease-in-out infinite alternate;
    }
    .g1{background:#ffe776;left:-90px;top:-80px}
    .g2{background:#ffd34b;right:-110px;bottom:-100px;animation-delay:1.7s}

    @keyframes floatGlow{
      from{transform:translate(0,0) scale(1)}
      to{transform:translate(20px,18px) scale(1.08)}
    }

    .card{
      width:min(94vw,760px);
      min-height:min(92vh,900px);
      padding:28px 20px 26px;
      text-align:center;
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    .small{
      opacity:0;
      transform:translateY(8px);
      letter-spacing:.13em;
      text-transform:uppercase;
      font-size:.78rem;
      color:#9b7622;
      margin-bottom:8px;
      animation:fadeUp .8s ease forwards .25s;
    }

    .title{
      margin:0;
      font-family: Georgia, "Times New Roman", serif;
      font-size:clamp(2rem,7vw,4.2rem);
      line-height:1.05;
      color:#6b5013;
      opacity:0;
      transform:translateY(12px);
      animation:fadeUp 1s ease forwards .55s;
    }

    .subtitle{
      width:min(92%,650px);
      margin:14px auto 6px;
      font-size:clamp(1rem,3.4vw,1.35rem);
      line-height:1.6;
      color:#7b6227;
      opacity:0;
      animation:fadeUp .95s ease forwards .95s;
    }

    .garden{
      width:min(100%,690px);
      height:430px;
      position:relative;
      margin-top:4px;
      filter:drop-shadow(0 18px 16px rgba(128,91,12,.12));
    }

    .tulip{
      position:absolute;
      bottom:26px;
      width:85px;
      height:315px;
      transform-origin:bottom center;
      opacity:0;
      transform:translateY(35px) scale(.5);
      animation:bloom 1.05s cubic-bezier(.2,.9,.25,1.2) forwards;
    }

    .tulip:nth-child(1){left:3%;animation-delay:1.5s;transform:translateY(35px) scale(.5) rotate(-7deg)}
    .tulip:nth-child(2){left:16%;height:355px;animation-delay:1.9s}
    .tulip:nth-child(3){left:30%;height:325px;animation-delay:2.3s;transform:translateY(35px) scale(.5) rotate(-3deg)}
    .tulip:nth-child(4){left:43%;height:390px;animation-delay:2.7s}
    .tulip:nth-child(5){left:57%;height:335px;animation-delay:3.1s;transform:translateY(35px) scale(.5) rotate(3deg)}
    .tulip:nth-child(6){left:70%;height:365px;animation-delay:3.5s}
    .tulip:nth-child(7){left:83%;height:315px;animation-delay:3.9s;transform:translateY(35px) scale(.5) rotate(7deg)}

    @keyframes bloom{
      0%{opacity:0;transform:translateY(48px) scale(.35)}
      60%{opacity:1;transform:translateY(-4px) scale(1.08)}
      100%{opacity:1;transform:translateY(0) scale(1)}
    }

    .stem{
      position:absolute;
      left:50%;
      bottom:0;
      width:8px;
      height:245px;
      transform:translateX(-50%);
      border-radius:8px;
      background:linear-gradient(90deg,var(--green-dark),var(--green),#79a95e);
    }

    .flower{
      position:absolute;
      left:50%;
      top:6px;
      width:76px;
      height:78px;
      transform:translateX(-50%);
    }

    .petal{
      position:absolute;
      width:44px;
      height:65px;
      top:9px;
      border-radius:52% 52% 48% 48% / 72% 72% 35% 35%;
      background:linear-gradient(180deg,var(--yellow-3),var(--yellow) 52%,var(--yellow-2));
      box-shadow:inset 0 -7px 10px rgba(201,139,12,.08);
    }

    .p-left{left:2px;transform:rotate(-21deg)}
    .p-right{right:2px;transform:rotate(21deg)}
    .p-mid{
      left:16px;
      top:2px;
      z-index:2;
      background:linear-gradient(180deg,#fff19c 0%,#ffe05a 55%,#ffc427 100%);
    }

    .leaf{
      position:absolute;
      width:40px;
      height:120px;
      bottom:68px;
      background:linear-gradient(135deg,#74a85e,#3f7b36);
      border-radius:90% 0 90% 0;
      transform-origin:bottom center;
      opacity:.98;
    }
    .leaf.left{left:8px;transform:rotate(-30deg)}
    .leaf.right{right:8px;transform:scaleX(-1) rotate(-29deg);bottom:110px}

    .ground{
      position:absolute;
      left:5%;
      right:5%;
      bottom:18px;
      height:18px;
      border-radius:50%;
      background:radial-gradient(ellipse at center,rgba(109,81,18,.16),transparent 65%);
      filter:blur(4px);
    }

    .message{
      width:min(92%,640px);
      margin-top:-6px;
      padding:20px 22px;
      border-radius:26px;
      background:rgba(255,255,255,.66);
      border:1px solid rgba(210,166,50,.24);
      box-shadow:0 14px 45px rgba(164,118,18,.09);
      backdrop-filter:blur(10px);
      opacity:0;
      transform:translateY(16px) scale(.98);
      animation:messageIn 1s ease forwards 4.7s;
    }

    .message p{
      margin:0;
      font-family:Georgia, "Times New Roman", serif;
      font-size:clamp(1.35rem,4.7vw,2rem);
      line-height:1.45;
      color:#664b11;
    }

    .heart{
      display:inline-block;
      margin-left:5px;
      animation:heartbeat 1.5s ease-in-out infinite 5.8s;
    }

    @keyframes heartbeat{
      0%,100%{transform:scale(1)}
      15%{transform:scale(1.18)}
      30%{transform:scale(1)}
      45%{transform:scale(1.13)}
      60%{transform:scale(1)}
    }

    @keyframes fadeUp{
      to{opacity:1;transform:translateY(0)}
    }

    @keyframes messageIn{
      to{opacity:1;transform:translateY(0) scale(1)}
    }

    .petal-fall{
      position:fixed;
      top:-40px;
      width:16px;
      height:27px;
      border-radius:75% 0 75% 0;
      background:linear-gradient(180deg,#fff19b,#ffd333);
      pointer-events:none;
      z-index:1;
      opacity:.76;
      animation:fall linear forwards;
    }

    @keyframes fall{
      0%{transform:translate3d(0,-5vh,0) rotate(0deg);opacity:0}
      10%{opacity:.85}
      100%{transform:translate3d(var(--drift),110vh,0) rotate(560deg);opacity:.05}
    }

    .replay{
      border:none;
      margin-top:18px;
      padding:11px 19px;
      border-radius:999px;
      background:#ffe169;
      color:#60480e;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(151,105,15,.13);
      opacity:0;
      animation:fadeUp .8s ease forwards 5.5s;
    }

    .replay:active{transform:scale(.97)}

    @media (max-width:600px){
      .card{padding:20px 10px}
      .garden{height:370px;transform:scale(.94);margin-top:-10px;margin-bottom:-10px}
      .tulip{width:70px}
      .tulip:nth-child(1){left:0%}
      .tulip:nth-child(2){left:14%}
      .tulip:nth-child(3){left:28%}
      .tulip:nth-child(4){left:42%}
      .tulip:nth-child(5){left:56%}
      .tulip:nth-child(6){left:70%}
      .tulip:nth-child(7){left:84%}
    }

    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{
        animation-duration:.01ms !important;
        animation-delay:0ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <main class="card">
    <div class="small">Un detallito para ti</div>
    <h1 class="title">🌷 Para mi lechuguita 🌷</h1>
    <div class="subtitle">Porque hasta un pequeño detalle puede alegrar el día.</div>

    <section class="garden" aria-label="Tulipanes amarillos">
      <div class="ground"></div>

      <div class="tulip">
        <div class="flower"><span class="petal p-left"></span><span class="petal p-mid"></span><span class="petal p-right"></span></div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>

      <div class="tulip">
        <div class="flower"><span class="petal p-left"></span><span class="petal p-mid"></span><span class="petal p-right"></span></div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>

      <div class="tulip">
        <div class="flower"><span class="petal p-left"></span><span class="petal p-mid"></span><span class="petal p-right"></span></div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>

      <div class="tulip">
        <div class="flower"><span class="petal p-left"></span><span class="petal p-mid"></span><span class="petal p-right"></span></div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>

      <div class="tulip">
        <div class="flower"><span class="petal p-left"></span><span class="petal p-mid"></span><span class="petal p-right"></span></div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>

      <div class="tulip">
        <div class="flower"><span class="petal p-left"></span><span class="petal p-mid"></span><span class="petal p-right"></span></div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>

      <div class="tulip">
        <div class="flower"><span class="petal p-left"></span><span class="petal p-mid"></span><span class="petal p-right"></span></div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>
    </section>

    <section class="message">
      <p>
        Para ti mi lechuguita,<br>
        que tengas un hermoso día
        <span class="heart">💛</span>
      </p>
    </section>

    <button class="replay" onclick="replayAnimation()">Ver otra vez ✨</button>
  </main>

  <script>
    function createFallingPetal(){
      const petal = document.createElement("span");
      petal.className = "petal-fall";
      petal.style.left = Math.random() * 100 + "vw";
      petal.style.setProperty("--drift", (Math.random() * 180 - 90) + "px");
      petal.style.animationDuration = (5 + Math.random() * 5) + "s";
      petal.style.animationDelay = (Math.random() * 1.8) + "s";
      petal.style.transform = `scale(${0.65 + Math.random() * 0.8})`;
      document.body.appendChild(petal);

      setTimeout(() => petal.remove(), 11000);
    }

    let petalsStarted = false;

    function startPetals(){
      if(petalsStarted) return;
      petalsStarted = true;
      setInterval(createFallingPetal, 650);
    }

    setTimeout(startPetals, 4200);

    function replayAnimation(){
      document.body.classList.add("restarting");

      const tulips = document.querySelectorAll(".tulip");
      const message = document.querySelector(".message");
      const small = document.querySelector(".small");
      const title = document.querySelector(".title");
      const subtitle = document.querySelector(".subtitle");
      const replay = document.querySelector(".replay");

      [...tulips, message, small, title, subtitle, replay].forEach(el => {
        el.style.animation = "none";
        void el.offsetWidth;
        el.style.animation = "";
      });

      window.scrollTo({top:0, behavior:"smooth"});
      setTimeout(() => document.body.classList.remove("restarting"), 100);
    }
  </script>
</body>
</html>
