<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff8dc" />
  <title>Para mi Karlita 💛</title>

  <style>
    :root{
      --bg1:#fffdf7;
      --bg2:#fff4c8;
      --ink:#6a4c12;
      --ink-soft:#856726;
      --gold:#d8ad34;
      --gold-2:#f1cf56;
      --leaf1:#78ab5a;
      --leaf2:#4e8e43;
      --stem1:#5ea14c;
      --stem2:#3f7f39;
      --petal1:#fff3a2;
      --petal2:#ffd94b;
      --petal3:#ffc72a;
      --paper1:#fffdf6;
      --paper2:#f3e6ba;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}

    body{
      min-height:100svh;
      overflow-x:hidden;
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 18% 10%, rgba(255,228,93,.35), transparent 24%),
        radial-gradient(circle at 82% 16%, rgba(255,242,176,.52), transparent 24%),
        linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 100%);
    }

    .page{
      width:min(100%, 760px);
      margin:0 auto;
      padding:24px 14px 38px;
      text-align:center;
      position:relative;
    }

    .eyebrow{
      letter-spacing:.18em;
      text-transform:uppercase;
      font-size:clamp(.75rem, 2.5vw, .95rem);
      color:#a68129;
      margin:0 0 10px;
      opacity:0;
      transform:translateY(10px);
      animation:fadeUp .7s ease forwards .15s;
    }

    .title{
      margin:0;
      font-family: Georgia, "Times New Roman", serif;
      font-size:clamp(2.35rem, 8vw, 4.5rem);
      line-height:1.02;
      color:#6a4a12;
      opacity:0;
      transform:translateY(10px);
      animation:fadeUp .85s ease forwards .35s;
    }

    .title .emoji{
      font-size:.72em;
      vertical-align:middle;
      margin:0 .18em;
    }

    .subtitle{
      width:min(92%, 640px);
      margin:14px auto 16px;
      font-size:clamp(1rem, 3.6vw, 1.32rem);
      line-height:1.5;
      color:var(--ink-soft);
      opacity:0;
      transform:translateY(10px);
      animation:fadeUp .85s ease forwards .6s;
    }

    .bouquet-stage{
      position:relative;
      width:min(100%, 680px);
      height:360px;
      margin:6px auto 10px;
      opacity:0;
      transform:translateY(14px);
      animation:fadeUp .85s ease forwards .85s;
    }

    .sparkle{
      position:absolute;
      font-size:20px;
      color:#e5c148;
      opacity:0;
      animation:twinkle 2.4s ease-in-out infinite;
      pointer-events:none;
    }
    .sp1{left:13%; top:18%; animation-delay:4.2s;}
    .sp2{right:15%; top:23%; animation-delay:4.8s;}
    .sp3{left:48%; top:9%; animation-delay:5.3s;}

    .wrapper{
      position:absolute;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      width:255px;
      height:175px;
      z-index:1;
      opacity:0;
      animation:wrapperIn .7s ease forwards 3.9s;
    }

    .paper-left,
    .paper-right,
    .paper-front{
      position:absolute;
      bottom:0;
      border:1px solid rgba(215,189,112,.45);
      box-shadow:0 12px 25px rgba(133,97,16,.08);
    }

    .paper-left{
      left:8px;
      width:150px;
      height:145px;
      background:linear-gradient(180deg, var(--paper1), var(--paper2));
      clip-path:polygon(6% 15%, 100% 0, 76% 100%, 0 82%);
      transform:rotate(-10deg);
      border-radius:18px;
    }

    .paper-right{
      right:8px;
      width:150px;
      height:145px;
      background:linear-gradient(180deg, var(--paper1), var(--paper2));
      clip-path:polygon(0 0, 94% 15%, 100% 82%, 24% 100%);
      transform:rotate(10deg);
      border-radius:18px;
    }

    .paper-front{
      left:50%;
      transform:translateX(-50%);
      width:178px;
      height:98px;
      background:linear-gradient(180deg, #fffef8, #f7edd0);
      clip-path:polygon(10% 0, 90% 0, 100% 100%, 0 100%);
      bottom:4px;
      border-radius:0 0 18px 18px;
    }

    .ribbon-band{
      position:absolute;
      left:50%;
      bottom:34px;
      transform:translateX(-50%);
      width:92px;
      height:24px;
      border-radius:9px;
      background:linear-gradient(180deg, #f4dc77, #dca622);
      z-index:5;
    }

    .ribbon-center{
      position:absolute;
      left:50%;
      bottom:34px;
      transform:translate(-50%, -1px);
      width:24px;
      height:24px;
      border-radius:50%;
      background:linear-gradient(180deg, #f8e48d, #ddb028);
      z-index:6;
    }

    .ribbon-loop{
      position:absolute;
      bottom:42px;
      width:34px;
      height:22px;
      border:8px solid #e4b533;
      border-radius:70% 70% 70% 70%;
      z-index:5;
    }
    .ribbon-loop.left{left:calc(50% - 34px); border-right-width:5px; transform:rotate(-25deg);}
    .ribbon-loop.right{left:calc(50% + 1px); border-left-width:5px; transform:scaleX(-1) rotate(-25deg);}

    .ribbon-tail{
      position:absolute;
      bottom:0;
      width:20px;
      height:52px;
      background:linear-gradient(180deg, #f4da72, #dfa928);
      clip-path:polygon(0 0,100% 0,100% 84%,50% 100%,0 84%);
      z-index:4;
    }
    .ribbon-tail.left{left:calc(50% - 18px); transform:rotate(6deg);}
    .ribbon-tail.right{left:calc(50% + 2px); transform:rotate(-6deg);}

    .ground-shadow{
      position:absolute;
      left:50%;
      bottom:0;
      transform:translateX(-50%);
      width:290px;
      height:26px;
      border-radius:50%;
      background:radial-gradient(ellipse at center, rgba(120,84,11,.18), transparent 68%);
      filter:blur(7px);
      z-index:0;
      opacity:.5;
    }

    .tulip{
      position:absolute;
      bottom:76px;
      width:82px;
      height:245px;
      transform-origin:bottom center;
      opacity:0;
      animation:bloom .9s cubic-bezier(.2,.9,.23,1.12) forwards;
      z-index:2;
    }

    .tulip .stem{
      position:absolute;
      left:50%;
      bottom:0;
      transform:translateX(-50%);
      width:8px;
      height:165px;
      border-radius:8px;
      background:linear-gradient(90deg,var(--stem2),var(--stem1),#7bb765);
      box-shadow:inset -1px 0 0 rgba(255,255,255,.14);
    }

    .flower{
      position:absolute;
      left:50%;
      top:0;
      transform:translateX(-50%);
      width:74px;
      height:78px;
      filter:drop-shadow(0 6px 8px rgba(216,165,35,.16));
    }

    .petal{
      position:absolute;
      border-radius:56% 56% 42% 42% / 72% 72% 30% 30%;
      background:linear-gradient(180deg,var(--petal1), var(--petal2) 55%, var(--petal3) 100%);
      box-shadow:inset 0 -6px 10px rgba(186,126,15,.12);
    }
    .petal.left{
      left:2px;
      top:14px;
      width:38px;
      height:56px;
      transform:rotate(-22deg);
    }
    .petal.mid{
      left:18px;
      top:3px;
      width:40px;
      height:61px;
      z-index:2;
      background:linear-gradient(180deg,#fff8bf, #ffe76b 58%, #ffca31 100%);
    }
    .petal.right{
      right:2px;
      top:14px;
      width:38px;
      height:56px;
      transform:rotate(22deg);
    }
    .petal.inner-left,
    .petal.inner-right{
      width:22px;
      height:34px;
      top:26px;
      z-index:3;
      opacity:.56;
      background:linear-gradient(180deg,#ffee95,#ffd54b);
    }
    .petal.inner-left{left:20px; transform:rotate(-8deg);}
    .petal.inner-right{right:20px; transform:rotate(8deg);}

    .leaf{
      position:absolute;
      width:34px;
      height:98px;
      background:linear-gradient(135deg,var(--leaf1),var(--leaf2));
      border-radius:88% 0 88% 0;
      box-shadow:inset -2px -4px 10px rgba(255,255,255,.08);
    }
    .leaf.left{
      left:11px;
      bottom:50px;
      transform:rotate(-34deg);
    }
    .leaf.right{
      right:11px;
      bottom:84px;
      transform:scaleX(-1) rotate(-31deg);
    }

    /* Bouquet arrangement */
    .t1{left:40px;  height:210px; animation-delay:1.1s; transform:translateY(25px) scale(.55) rotate(-28deg);}
    .t2{left:100px; height:230px; animation-delay:1.45s; transform:translateY(25px) scale(.55) rotate(-18deg);}
    .t3{left:165px; height:250px; animation-delay:1.8s; transform:translateY(25px) scale(.55) rotate(-10deg);}
    .t4{left:235px; height:268px; animation-delay:2.15s; transform:translateY(25px) scale(.55) rotate(-3deg);}
    .t5{left:304px; height:278px; animation-delay:2.5s; transform:translateY(25px) scale(.55) rotate(0deg);}
    .t6{left:372px; height:268px; animation-delay:2.85s; transform:translateY(25px) scale(.55) rotate(4deg);}
    .t7{left:442px; height:250px; animation-delay:3.2s; transform:translateY(25px) scale(.55) rotate(11deg);}
    .t8{left:507px; height:230px; animation-delay:3.55s; transform:translateY(25px) scale(.55) rotate(19deg);}
    .t9{left:567px; height:210px; animation-delay:3.9s; transform:translateY(25px) scale(.55) rotate(28deg);}

    .tulip.t1 .stem,.tulip.t9 .stem{height:135px}
    .tulip.t2 .stem,.tulip.t8 .stem{height:150px}
    .tulip.t3 .stem,.tulip.t7 .stem{height:166px}
    .tulip.t4 .stem,.tulip.t6 .stem{height:183px}
    .tulip.t5 .stem{height:195px}

    .message{
      width:min(92%, 620px);
      margin:8px auto 0;
      padding:22px 18px;
      border-radius:28px;
      background:rgba(255,255,255,.72);
      border:1px solid rgba(210,174,73,.20);
      box-shadow:0 16px 42px rgba(150,109,18,.10);
      backdrop-filter:blur(8px);
      opacity:0;
      transform:translateY(12px);
      animation:fadeUp .85s ease forwards 4.6s;
    }

    .message p{
      margin:0;
      font-family: Georgia, "Times New Roman", serif;
      font-size:clamp(1.4rem, 4.8vw, 2.1rem);
      line-height:1.35;
      color:#6b4f16;
    }

    .replay{
      margin-top:18px;
      padding:12px 24px;
      border:none;
      border-radius:999px;
      background:linear-gradient(180deg, #ffe986, #f2d04a);
      color:#6a4d13;
      font-weight:800;
      font-size:1rem;
      box-shadow:0 10px 22px rgba(151,110,20,.14);
      cursor:pointer;
      opacity:0;
      transform:translateY(12px);
      animation:fadeUp .85s ease forwards 5.1s;
    }

    .falling{
      position:fixed;
      top:-30px;
      width:15px;
      height:24px;
      border-radius:74% 0 74% 0;
      background:linear-gradient(180deg,#fff4ac,#ffd43e);
      pointer-events:none;
      opacity:.78;
      z-index:1;
      animation:fall linear forwards;
    }

    @keyframes fadeUp{
      to{opacity:1;transform:translateY(0)}
    }

    @keyframes bloom{
      0%{opacity:0}
      65%{opacity:1; transform:translateY(-4px) scale(1.05) rotate(var(--rot, 0deg));}
      100%{opacity:1; transform:translateY(0) scale(1) rotate(var(--rot, 0deg));}
    }

    @keyframes wrapperIn{
      from{opacity:0; transform:translateX(-50%) translateY(8px) scale(.96);}
      to{opacity:1; transform:translateX(-50%) translateY(0) scale(1);}
    }

    @keyframes twinkle{
      0%,100%{opacity:0; transform:scale(.75)}
      50%{opacity:1; transform:scale(1.08)}
    }

    @keyframes fall{
      0%{transform:translate3d(0,-5vh,0) rotate(0deg); opacity:0}
      10%{opacity:.82}
      100%{transform:translate3d(var(--drift),110vh,0) rotate(560deg); opacity:.05}
    }

    @media (max-width:680px){
      .bouquet-stage{
        height:340px;
      }
      .wrapper{
        width:235px;
        height:160px;
      }
      .tulip{
        width:70px;
      }
      .flower{
        width:64px;
        height:68px;
      }
      .petal.left,.petal.right{
        width:33px;height:50px;
      }
      .petal.mid{
        width:36px;height:55px;left:14px;
      }
      .petal.inner-left{left:17px}
      .petal.inner-right{right:17px}
      .leaf{
        width:29px;height:84px;
      }

      .t1{left:20px}
      .t2{left:72px}
      .t3{left:128px}
      .t4{left:188px}
      .t5{left:248px}
      .t6{left:308px}
      .t7{left:368px}
      .t8{left:424px}
      .t9{left:476px}
    }

    @media (max-width:520px){
      .page{padding-top:22px}
      .subtitle{margin-bottom:6px}
      .bouquet-stage{
        height:315px;
      }
      .wrapper{
        width:215px;
        height:150px;
        bottom:22px;
      }
      .paper-left,.paper-right{
        width:126px;
        height:124px;
      }
      .paper-front{
        width:154px;
        height:86px;
      }
      .ground-shadow{
        width:245px;
        height:24px;
      }
      .tulip{
        width:58px;
      }
      .flower{
        width:56px;
        height:61px;
      }
      .petal.left,.petal.right{
        width:28px;height:44px;
      }
      .petal.mid{
        width:31px;height:48px;left:13px;
      }
      .petal.inner-left,.petal.inner-right{
        width:18px;height:28px;top:20px;
      }
      .petal.inner-left{left:16px}
      .petal.inner-right{right:16px}
      .leaf{
        width:24px;height:74px;
      }
      .leaf.left{left:8px;bottom:44px}
      .leaf.right{right:8px;bottom:72px}
      .tulip .stem{width:7px}

      .t1{left:4px;   height:185px; --rot:-28deg}
      .t2{left:44px;  height:202px; --rot:-18deg}
      .t3{left:88px;  height:220px; --rot:-10deg}
      .t4{left:136px; height:236px; --rot:-3deg}
      .t5{left:184px; height:245px; --rot:0deg}
      .t6{left:232px; height:236px; --rot:4deg}
      .t7{left:280px; height:220px; --rot:11deg}
      .t8{left:324px; height:202px; --rot:19deg}
      .t9{left:364px; height:185px; --rot:28deg}

      .tulip.t1 .stem,.tulip.t9 .stem{height:120px}
      .tulip.t2 .stem,.tulip.t8 .stem{height:130px}
      .tulip.t3 .stem,.tulip.t7 .stem{height:144px}
      .tulip.t4 .stem,.tulip.t6 .stem{height:155px}
      .tulip.t5 .stem{height:165px}
    }

    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{
        animation-duration:.01ms !important;
        animation-delay:0ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">UN DETALLITO PARA TI</p>
    <h1 class="title"><span class="emoji">🌷</span>Para mi Karlita<span class="emoji">🌷</span></h1>
    <p class="subtitle">Porque hasta un pequeño detalle puede alegrarte el día.</p>

    <section class="bouquet-stage" aria-label="Ramo de tulipanes amarillos">
      <div class="sparkle sp1">✦</div>
      <div class="sparkle sp2">✦</div>
      <div class="sparkle sp3">✦</div>

      <div class="ground-shadow"></div>

      <div class="wrapper">
        <div class="paper-left"></div>
        <div class="paper-right"></div>
        <div class="paper-front"></div>
        <div class="ribbon-band"></div>
        <div class="ribbon-center"></div>
        <div class="ribbon-loop left"></div>
        <div class="ribbon-loop right"></div>
        <div class="ribbon-tail left"></div>
        <div class="ribbon-tail right"></div>
      </div>

      <div class="tulip t1" style="--rot:-28deg">
        <div class="flower">
          <span class="petal left"></span><span class="petal mid"></span><span class="petal right"></span>
          <span class="petal inner-left"></span><span class="petal inner-right"></span>
        </div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>

      <div class="tulip t2" style="--rot:-18deg">
        <div class="flower">
          <span class="petal left"></span><span class="petal mid"></span><span class="petal right"></span>
          <span class="petal inner-left"></span><span class="petal inner-right"></span>
        </div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>

      <div class="tulip t3" style="--rot:-10deg">
        <div class="flower">
          <span class="petal left"></span><span class="petal mid"></span><span class="petal right"></span>
          <span class="petal inner-left"></span><span class="petal inner-right"></span>
        </div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>

      <div class="tulip t4" style="--rot:-3deg">
        <div class="flower">
          <span class="petal left"></span><span class="petal mid"></span><span class="petal right"></span>
          <span class="petal inner-left"></span><span class="petal inner-right"></span>
        </div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>

      <div class="tulip t5" style="--rot:0deg">
        <div class="flower">
          <span class="petal left"></span><span class="petal mid"></span><span class="petal right"></span>
          <span class="petal inner-left"></span><span class="petal inner-right"></span>
        </div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>

      <div class="tulip t6" style="--rot:4deg">
        <div class="flower">
          <span class="petal left"></span><span class="petal mid"></span><span class="petal right"></span>
          <span class="petal inner-left"></span><span class="petal inner-right"></span>
        </div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>

      <div class="tulip t7" style="--rot:11deg">
        <div class="flower">
          <span class="petal left"></span><span class="petal mid"></span><span class="petal right"></span>
          <span class="petal inner-left"></span><span class="petal inner-right"></span>
        </div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>

      <div class="tulip t8" style="--rot:19deg">
        <div class="flower">
          <span class="petal left"></span><span class="petal mid"></span><span class="petal right"></span>
          <span class="petal inner-left"></span><span class="petal inner-right"></span>
        </div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>

      <div class="tulip t9" style="--rot:28deg">
        <div class="flower">
          <span class="petal left"></span><span class="petal mid"></span><span class="petal right"></span>
          <span class="petal inner-left"></span><span class="petal inner-right"></span>
        </div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>
    </section>

    <section class="message">
      <p>Para ti mi Lechuguita,<br>que tengas un hermoso día 💛</p>
    </section>

    <button class="replay" onclick="replayAnimation()">Ver otra vez ✨</button>
  </main>

  <script>
    function createFallingPetal(){
      const petal = document.createElement("span");
      petal.className = "falling";
      petal.style.left = Math.random() * 100 + "vw";
      petal.style.setProperty("--drift", (Math.random() * 180 - 90) + "px");
      petal.style.animationDuration = (5 + Math.random() * 5) + "s";
      petal.style.transform = `scale(${0.65 + Math.random() * 0.8})`;
      document.body.appendChild(petal);
      setTimeout(() => petal.remove(), 11000);
    }

    let petalsStarted = false;

    function startPetals(){
      if(petalsStarted) return;
      petalsStarted = true;
      setInterval(createFallingPetal, 850);
    }

    setTimeout(startPetals, 4300);

    function replayAnimation(){
      const animated = document.querySelectorAll(
        '.eyebrow, .title, .subtitle, .bouquet-stage, .tulip, .wrapper, .message, .replay, .sparkle'
      );
      animated.forEach(el => {
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = '';
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
